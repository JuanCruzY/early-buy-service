spring.application.name=early-buy-service

server.port=${SERVER_PORT:3005}

spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/earlybuy}
spring.data.mongodb.auto-index-creation=true

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
spring.rabbitmq.virtual-host=${RABBITMQ_VIRTUAL_HOST:/}

earlybuy.auth.base-url=${AUTH_BASE_URL:http://localhost:3000}
