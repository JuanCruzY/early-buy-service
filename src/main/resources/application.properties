spring.application.name=early-buy-service

server.port=${SERVER_PORT:3005}

spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/earlybuy}
spring.data.mongodb.auto-index-creation=true

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
spring.rabbitmq.virtual-host=${RABBITMQ_VIRTUAL_HOST:/}
spring.rabbitmq.connection-timeout=${RABBITMQ_CONNECTION_TIMEOUT:3s}
spring.rabbitmq.channel-rpc-timeout=${RABBITMQ_CHANNEL_RPC_TIMEOUT:3s}
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true

earlybuy.catalog.validation-timeout=${CATALOG_VALIDATION_TIMEOUT:5s}
earlybuy.catalog.max-pending-requests=${CATALOG_MAX_PENDING_REQUESTS:256}

earlybuy.notification.confirmation-timeout=${NOTIFICATION_CONFIRMATION_TIMEOUT:5s}

earlybuy.auth.base-url=${AUTH_BASE_URL:http://localhost:3000}
earlybuy.auth.connect-timeout=${AUTH_CONNECT_TIMEOUT:1s}
earlybuy.auth.read-timeout=${AUTH_READ_TIMEOUT:3s}
